name: promscope

# Both replicas alias this one block: identical config by construction -
# the config-homogeneity corollary from SPEC section 5. PROMSCOPE_STATELESS
# is env-substituted so the M5 A/B experiment flips BOTH replicas at once:
#   PROMSCOPE_STATELESS=false docker compose -f deploy/compose.yaml up -d
x-promscope: &promscope
  build:
    context: ..
    args:
      CMD: promscope
  environment:
    PROMSCOPE_PROMETHEUS_URL: http://prometheus:9090
    PROMSCOPE_STATELESS: ${PROMSCOPE_STATELESS:-true}
  healthcheck:
    # Distroless has no shell; the binary probes itself (exec form).
    test: ["CMD", "/app", "-healthcheck"]
    interval: 5s
    timeout: 2s
    retries: 3
  depends_on:
    prometheus:
      condition: service_healthy

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    ports:
      # Loopback only (security review M1): this stack is a demo with no
      # auth anywhere - it must never listen on the LAN.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
      # RunPod recipe: render the token to deploy/secrets/runpod-token
      # (gitignored) and uncomment - see prometheus.yml.
      # - ./secrets/runpod-token:/etc/prometheus/runpod-token:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 2s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a

  mock-vllm:
    build:
      context: ..
      args:
        CMD: mock-vllm-exporter

  promscope-a: *promscope
  promscope-b: *promscope

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      # Same port a locally-run promscope would use, loopback only.
      - "127.0.0.1:8090:8090"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      promscope-a:
        condition: service_healthy
      promscope-b:
        condition: service_healthy
