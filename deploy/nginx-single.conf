events {}

http {
  # H2 override: ONE upstream, so "1 replica vs 2" is a pure comparison
  # through the identical proxy path. Used via compose.single.yaml.
  upstream promscope {
    server promscope-a:8090;
  }

  server {
    listen 8090;

    location / {
      if ($host !~ ^(localhost|127\.0\.0\.1|nginx)$) {
        return 421;
      }

      proxy_pass http://promscope;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      add_header X-Promscope-Backend $upstream_addr always;
    }
  }
}
