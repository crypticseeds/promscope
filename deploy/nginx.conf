events {}

http {
  # Plain round-robin, deliberately dumb: the stateless thesis says any
  # replica serves any request, so no ip_hash, no sticky cookies.
  upstream promscope {
    server promscope-a:8090;
    server promscope-b:8090;
  }

  server {
    listen 8090;

    location / {
      # DNS-rebinding guard (security review M1): behind the proxy the SDK
      # cannot see a loopback peer, so ITS rebinding defense is inert - the
      # Host allowlist has to live here. "nginx" admits compose-internal
      # clients (k6); a rebinding attack carries the attacker's domain in
      # Host, never these values. 421 = Misdirected Request.
      if ($host !~ ^(localhost|127\.0\.0\.1|nginx)$) {
        return 421;
      }

      proxy_pass http://promscope;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      # nginx buffers responses by default, which silently stalls SSE
      # streams (every MCP response here is SSE-framed).
      proxy_buffering off;
      proxy_read_timeout 300s;

      # Which replica answered - makes round-robin visible in demos and
      # lets the M5 load test attribute failures to backends.
      add_header X-Promscope-Backend $upstream_addr always;
    }
  }
}
