global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # The mock keeps the demo GPU-free. To point at REAL vLLM on RunPod (D1):
  # comment this job out, uncomment vllm-runpod below, and set the pod ID.
  # promscope needs no change - it discovers whatever lands in Prometheus.
  - job_name: vllm
    static_configs:
      - targets: ["mock-vllm:9105"]

  # - job_name: vllm-runpod
  #   scheme: https
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["<POD_ID>-8000.proxy.runpod.net"]
  #   # If vLLM runs with --api-key and /metrics sits behind it: render the
  #   # token from Doppler into deploy/secrets/runpod-token (that exact path
  #   # is gitignored and dockerignored), uncomment the bind mount in
  #   # compose.yaml, then:
  #   # authorization:
  #   #   type: Bearer
  #   #   credentials_file: /etc/prometheus/runpod-token

  # promscope watching promscope: the self-metrics from both replicas.
  - job_name: promscope
    static_configs:
      - targets: ["promscope-a:8090", "promscope-b:8090"]
